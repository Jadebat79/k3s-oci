# Postgres and Redis accept connections only from the app pods listed here
# (namespace + pod label) and from pods in the data namespace (backups, admin).
# Enforced by k3s's built-in network policy controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-apps
  namespace: data
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: aristocrats
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: aristocrats-api
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: omnipay
          podSelector:
            matchLabels:
              app: omnipay
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bht
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: bht-api
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-from-apps
  namespace: data
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: aristocrats
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: aristocrats-api
      ports:
        - port: 6379
