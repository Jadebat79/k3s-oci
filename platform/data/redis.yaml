# One Redis 7 for every app. Each app gets its own ACL user limited to its own
# key prefix (add-redis-user.sh); the default user is off. Users live in
# Secret redis-users (users.acl), generated by bootstrap.sh, never in git.
# Append-only file on disk, so queued messages survive a restart.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: data
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: data
spec:
  replicas: 1
  strategy:
    type: Recreate # one disk, one writer
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes", "--save", "60", "1000",
                 "--aclfile", "/etc/redis/users.acl"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli --user healthcheck --pass x --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /data
            - name: acl
              mountPath: /etc/redis
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
        - name: acl
          secret:
            secretName: redis-users
